[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "team-writing-memory"
version = "0.2.0"
description = "Traceable writing revisions and reviewed team knowledge"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
writing-memory = "writing_memory.cli:main"
writing-memory-rsih = "writing_memory.rsih_workspace:main"

[tool.setuptools.packages.find]
include = ["writing_memory*"]

[tool.setuptools.package-data]
writing_memory = ["prompts/*.md", "templates/writing-genome/*.json", "templates/writing-genome/components/*.json", "templates/writing-genome/contracts/*.md"]
