[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "team-writing-memory"
version = "0.3.0"
description = "Traceable writing revisions and reviewed team knowledge"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pypdfium2>=4.30,<6", "python-pptx>=1.0,<2", "python-docx>=1.2,<2", "Pillow>=11,<13", "pyobjc-framework-Vision>=11,<13; sys_platform == 'darwin'"]

[project.optional-dependencies]
test = ["httpx>=0.27,<1"]

[project.scripts]
writing-memory = "writing_memory.cli:main"
writing-memory-rsih = "writing_memory.rsih_workspace:main"

[tool.setuptools.packages.find]
include = ["writing_memory*"]

[tool.setuptools.package-data]
writing_memory = ["prompts/*.md", "static/*", "templates/writing-genome/*.json", "templates/writing-genome/components/*.json", "templates/writing-genome/contracts/*.md"]
